<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker - DevOps Mini Project</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#1f2937}
  h1{margin-bottom:0} small{color:#6b7280}
  form{display:flex;gap:8px;margin:20px 0}
  input{flex:1;padding:10px;border:1px solid #d1d5db;border-radius:6px}
  button{padding:10px 16px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
  li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #e5e7eb}
  li.done span{text-decoration:line-through;color:#9ca3af}
  ul{list-style:none;padding:0} .link{background:none;color:#2563eb;padding:4px 8px}
</style>
</head>
<body>
<h1>Task Tracker</h1>
<small>DevOps Mini Project &middot; v{{ version }} &middot; <a href="/health">/health</a></small>
<form id="f"><input id="t" placeholder="Add a task..." required><button>Add</button></form>
<ul id="list"></ul>
<script>
async function load(){
  const r = await fetch('/api/tasks'); const tasks = await r.json();
  document.getElementById('list').innerHTML = tasks.map(t =>
    `<li class="${t.done?'done':''}"><span>${t.title.replace(/</g,'&lt;')}</span>
     <span><button class="link" onclick="tog(${t.id})">${t.done?'Undo':'Done'}</button>
     <button class="link" onclick="del(${t.id})">Delete</button></span></li>`).join('');
}
async function tog(id){await fetch('/api/tasks/'+id,{method:'PATCH'});load()}
async function del(id){await fetch('/api/tasks/'+id,{method:'DELETE'});load()}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault(); const i=document.getElementById('t');
  await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.value})});
  i.value=''; load();
};
load();
</script>
</body>
</html>
